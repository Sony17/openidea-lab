name: Feature request
description: Something Lab should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do and where Lab got in the way.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This is about turning an idea, paper or photo into a prototype (Lab), not about search, Studio or Workspaces (those belong in Sony17/Ecosyz)
